plugins { id 'com.android.application' }

android {
    namespace 'com.synthlabs.twohearts'
    compileSdk 34

    defaultConfig {
        applicationId "com.synthlabs.twohearts"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { applicationIdSuffix "" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding false }
}

// Dependency policy (see docs/): only stable, first-party AndroidX/Material
// libraries. Every entry below has a concrete purpose and no cloud service.
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'          // themes, compat activities
    implementation 'com.google.android.material:material:1.12.0' // Material components / bottom nav
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.security:security-crypto:1.0.0'     // encrypted prefs for App Lock / Vault keys
    implementation 'androidx.biometric:biometric:1.1.0'          // optional fingerprint unlock
}
